name: aws-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Manual only: start it from Actions -> aws-deploy -> Run workflow, on main. Vercel stays the live
  # host until the cutover, so a deploy here does not change what users see yet.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Public values are inlined into the browser bundle at build time, so they come from
    # repository variables here (SST secrets are for server-only values).
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      TRIAL_DURATION_DAYS: ${{ vars.TRIAL_DURATION_DAYS }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION }}
      WHATSAPP_BASE_URL: ${{ vars.WHATSAPP_BASE_URL }}
      GRAPH_API_BASE_URL: ${{ vars.GRAPH_API_BASE_URL }}
      QSTASH_URL: ${{ vars.QSTASH_URL }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      PUSH_EVENING_ENABLED: ${{ vars.PUSH_EVENING_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TEMP debug: print the OIDC claims GitHub issues (sub and aud only). Remove after the fix.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print('sub=' + d['sub']); print('aud=' + str(d['aud']))"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: npm ci
      - run: npm ci
        working-directory: infra
      - run: npx sst deploy --stage production
        working-directory: infra
